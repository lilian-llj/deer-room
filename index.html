<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小鹿的房间</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  /* 3D 画布固定铺满"面板左侧"区域，由 main.js 的 applyResize() 同步 width/height */
  #app { display: block; position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(255,255,255,.82); color: #5b4a3a; padding: 8px 16px;
    border-radius: 999px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.12);
    backdrop-filter: blur(6px); white-space: nowrap; z-index: 10; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    background: #f3e9dc; color: #8a6f5a; font-size: 15px; transition: opacity .5s; z-index: 20; }

  /* ===== 右侧常驻信息面板（紧凑 v2：单屏无滚动，更小字号/间距/照片） ===== */
  #side-panel {
    position: fixed; top: 0; right: 0; z-index: 15;
    width: 320px; height: 100vh; box-sizing: border-box;
    background: rgba(251,243,231,.86);
    backdrop-filter: blur(10px);
    border-left: 1px solid rgba(255,255,255,.7);
    box-shadow: -14px 0 44px rgba(90,70,50,.18);
    padding: 14px 14px;
    display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }
  /* 照片占位：再缩到 48% 宽度，进一步腾空间 */
  .photo {
    width: 48%;
    margin: 0 auto;
    aspect-ratio: 3 / 4;
    border: 2px dashed #c98a5e; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: #8a7458; background: rgba(255,255,255,.5);
  }
  .photo .cam { font-size: 22px; opacity: .7; }
  .photo .t { font-size: 10.5px; font-weight: 600; }
  .photo .s { font-size: 9px; opacity: .85; }
  .welcome {
    text-align: center; font-size: 12px; line-height: 1.55; color: #5a4632;
    background: rgba(255,255,255,.6); border-radius: 10px; padding: 8px 10px;
  }
  .welcome b { color: #e07856; }
  .divider { height: 1px; background: #e6d3ba; }
  .map-head .h { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #5a4632; }
  .map-head .sub { font-size: 10px; color: #8a7458; margin-top: 2px; }
  .room-map { display: flex; flex-direction: column; gap: 5px; }
  .rm-item {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,.62); border: 1px solid #e6d3ba; border-radius: 9px;
    padding: 6px 10px; cursor: pointer; transition: .15s;
  }
  .rm-item:hover { transform: translateX(-3px); border-color: #e07856; box-shadow: 0 6px 14px rgba(224,120,86,.18); }
  .rm-item .ic { font-size: 16px; width: 20px; text-align: center; }
  .rm-item .meta { flex: 1; }
  .rm-item .name { font-size: 11.5px; font-weight: 600; color: #5a4632; }
  .rm-item .loc { font-size: 9.5px; color: #8a7458; margin-top: 1px; }
  .rm-item .ar { color: #e07856; font-size: 13px; }
  .panel-foot { display: none; }  /* 隐藏底部脚注，腾空间 */

  /* 手机端：面板在底部抽屉，canvas 占满屏幕宽度 */
  @media (max-width: 640px) {
    #app { width: 100vw; }
    #side-panel {
      width: 100%; height: auto; top: auto; bottom: 0;
      max-height: 56vh;
      border-left: none; border-top: 1px solid rgba(255,255,255,.7);
      padding: 14px 14px;
      gap: 9px;
    }
    .photo { width: 50%; aspect-ratio: 4 / 3; }
    #hud { bottom: auto; top: 14px; }
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="hud">WASD / 方向键 移动小鹿 · 点击地面让小鹿走过去</div>
<div id="loading">正在加载房间…</div>

<!-- 右侧常驻信息面板（静态版：照片虚框 + 欢迎语 + Room Map 导航） -->
<aside id="side-panel">
  <div class="photo">
    <div class="cam">📷</div>
    <div class="t">你的真实照片（虚框占位）</div>
    <div class="s">后期替换为 3:4 真实照片</div>
  </div>

  <div class="welcome">欢迎来到 <b>lilian</b> 创作的小鹿 room，<br>在这里，你可以更加了解我</div>

  <div class="divider"></div>

  <div class="map-head">
    <div class="h">🗺 Room Map · 房间探索指引</div>
    <div class="sub">点不到 3D 物件？从这里直达对应内容</div>
  </div>

  <div class="room-map">
    <div class="rm-item">
      <div class="ic">💻</div>
      <div class="meta"><div class="name">我的作品</div><div class="loc">触发点：左侧靠窗的书桌 / 电脑</div></div>
      <div class="ar">›</div>
    </div>
    <div class="rm-item">
      <div class="ic">🛋️</div>
      <div class="meta"><div class="name">关于我</div><div class="loc">触发点：房间后方的薰衣草沙发</div></div>
      <div class="ar">›</div>
    </div>
    <div class="rm-item">
      <div class="ic">✉️</div>
      <div class="meta"><div class="name">联系方式</div><div class="loc">触发点：书桌上的信件 / 信箱</div></div>
      <div class="ar">›</div>
    </div>
    <div class="rm-item">
      <div class="ic">🪴</div>
      <div class="meta"><div class="name">随笔 / 生活</div><div class="loc">触发点：角落绿植 / 墙上挂画</div></div>
      <div class="ar">›</div>
    </div>
  </div>

  <div class="panel-foot">每个 Room Map 条目 = 房间里一个可点击触发点</div>
</aside>

<!-- 单文件 bundle：three.js + OrbitControls + main.js 全部打包在一起，无 ES Module 依赖。
     ?v= 时间戳用于绕开 GitHub Pages CDN + 浏览器双层缓存，每次发版手动递增 -->
<script src="./bundle.js?v=20260729-1410"></script>
</body>
</html>
